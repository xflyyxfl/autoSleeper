plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vlab.autosleeper'
    compileSdk 34

    defaultConfig {
        applicationId "com.vlab.autosleeper"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "1.11.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
